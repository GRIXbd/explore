<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      /* ছবির অক্ষরের সাথে হুবহু মিল রাখতে Playfair Display ফন্ট */
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;display=swap');
    </style>
    
    <!-- 'G' অক্ষরের উপরিভাগ (কালো অংশ) কাট করার জন্য ClipPath -->
    <clipPath id="top-cut">
      <!-- পলিগনটি উপর থেকে শুরু হয়ে ঠিক মাঝখানের বার এর উপরে গিয়ে নিচে নেমেছে -->
      <polygon points="0,0 512,0 512,160 380,220 260,240 200,512 0,512" />
    </clipPath>
  </defs>
  
  <!-- ১ম স্তর: সম্পূর্ণ কালো ব্যাকগ্রাউন্ড -->
  <rect width="100%" height="100%" fill="#000000"/>
  
  <!-- ২য় স্তর: সম্পূর্ণ 'G' (ক্রিম কালার) - এটি নিচের অংশ হিসেবে দেখা যাবে -->
  <text x="256" y="400" 
        text-anchor="middle" 
        font-family="'Playfair Display', serif" 
        font-weight="900" 
        font-size="440" 
        fill="#F4EFE6">G</text>
        
  <!-- ৩য় স্তর: আবারও 'G' (কালো কালার) - তবে এবার ClipPath দিয়ে শুধু উপরিভাগ দেখানো হবে -->
  <text x="256" y="400" 
        text-anchor="middle" 
        font-family="'Playfair Display', serif" 
        font-weight="900" 
        font-size="440" 
        fill="#222222" 
        clip-path="url(#top-cut)">G</text>
</svg>